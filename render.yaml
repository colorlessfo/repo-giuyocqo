# Free web instance; account/task storage must use an independent PostgreSQL database.
# Enter DATABASE_URL securely in Render. It must never be committed or sent in chat.
services:
  - type: web
    name: qiyu-ddl
    runtime: docker
    branch: qiyu-ddl
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: REQUIRE_DATABASE_URL
        value: 'true'
      - key: DATABASE_URL
        sync: false
